allowBuilds:
  esbuild: true

# Published client-store imports these packages but declares them only as
# devDependencies. Supply them for Node integration tests. The browser build
# uses DSH's shared client-store module and does not bundle these copies.
packageExtensions:
  '@deepseek-ai/dsh-client-store@0.2.2-rc.3':
    dependencies:
      zustand: '~4.5.7'
      immer: '^10.1.1'
